<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Over Scoreboard</title>
<style>
  /* Base Reset */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    /* Creating a stadium night-time look with grass at the bottom */
    background: 
      linear-gradient(to bottom, transparent 65%, rgba(0, 0, 0, 0.4) 65%),
      linear-gradient(to bottom, #0f172a 0%, #1e293b 65%, #14532d 65%, #064e3b 100%);
    color: white;
    overflow: hidden;
  }

  /* Header / Logo Area */
  .header {
    margin-top: 40px;
    margin-bottom: 50px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }

  .header svg {
    width: 40px;
    height: 40px;
    fill: white;
  }

  /* Scoreboards Container */
  .scoreboard-container {
    display: flex;
    gap: 40px;
    z-index: 10;
  }

  /* Individual Team Cards */
  .card {
    width: 360px;
    border-radius: 20px;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 2px 5px rgba(255, 255, 255, 0.2);
    position: relative;
    overflow: hidden;
  }

  /* Subtle texture overlay for cards */
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: radial-gradient(rgba(255,255,255,0.1) 1px, transparent 1px);
    background-size: 10px 10px;
    opacity: 0.3;
    pointer-events: none;
  }

  /* Team Specific Colors */
  .card.ind {
    background: linear-gradient(135deg, #1e40af, #2563eb);
    border: 2px solid #3b82f6;
  }

  .card.pak {
    background: linear-gradient(135deg, #166534, #22c55e);
    border: 2px solid #4ade80;
  }

  /* Team Names */
  .team-name {
    font-size: 54px;
    font-weight: 900;
    margin-bottom: 25px;
    letter-spacing: 3px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
  }

  /* Ball by Ball Timeline */
  .balls-timeline {
    display: flex;
    gap: 12px;
    margin-bottom: 25px;
  }

  .ball {
    width: 36px;
    height: 36px;
    background-color: white;
    color: #111;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 20px;
    font-weight: 900;
    box-shadow: 0 4px 8px rgba(0,0,0,0.4);
  }

  /* Total Score */
  .score {
    font-size: 50px;
    font-weight: 800;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
  }

  /* Bottom Controls Container */
  .controls {
    margin-top: 60px;
    display: flex;
    gap: 30px;
    z-index: 10;
  }

  /* 3D Action Buttons */
  .btn {
    width: 80px;
    height: 80px;
    border-radius: 24px;
    border: 4px solid white;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: all 0.15s ease;
    outline: none;
  }

  .btn svg {
    width: 40px;
    height: 40px;
    fill: white;
  }

  .btn-bat {
    background: linear-gradient(145deg, #f59e0b, #d97706);
    box-shadow: 0 10px 0 #b45309, 0 20px 25px rgba(0,0,0,0.5);
  }

  .btn-reset {
    background: linear-gradient(145deg, #ef4444, #dc2626);
    box-shadow: 0 10px 0 #991b1b, 0 20px 25px rgba(0,0,0,0.5);
  }

  /* Hover & Active (Click) Animations */
  .btn:hover {
    filter: brightness(1.1);
  }

  .btn:active {
    transform: translateY(10px);
    box-shadow: 0 0 0 transparent, 0 10px 15px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <!-- Inline SVG for Batting Icon -->
    <svg viewBox="0 0 24 24">
      <path d="M14.5 2.5l-9.5 9.5c-.8.8-.8 2 0 2.8l2.2 2.2c.8.8 2 .8 2.8 0l9.5-9.5V2.5h-5zM4 20h3v2H2v-5h2v3z" />
    </svg>
    SUPER OVER
  </div>

  <!-- Scoreboards -->
  <div class="scoreboard-container">
    
    <!-- India Card -->
    <div class="card ind">
      <div class="team-name">IND</div>
      <div class="balls-timeline">
        <div class="ball">4</div>
        <div class="ball">3</div>
        <div class="ball">2</div>
        <div class="ball">6</div>
        <div class="ball">6</div>
        <div class="ball">6</div>
      </div>
      <div class="score">27 / 0</div>
    </div>

    <!-- Pakistan Card -->
    <div class="card pak">
      <div class="team-name">PAK</div>
      <div class="balls-timeline">
        <div class="ball">2</div>
        <div class="ball">4</div>
        <div class="ball">0</div>
        <div class="ball">3</div>
        <div class="ball">1</div>
        <div class="ball">4</div>
      </div>
      <div class="score">14 / 0</div>
    </div>

  </div>

  <!-- Bottom Buttons -->
  <div class="controls">
    
    <!-- Play/Bat Button -->
    <button class="btn btn-bat" aria-label="Play">
      <svg viewBox="0 0 24 24">
        <path d="M14.5 2.5l-9.5 9.5c-.8.8-.8 2 0 2.8l2.2 2.2c.8.8 2 .8 2.8 0l9.5-9.5V2.5h-5z"/>
      </svg>
    </button>

    <!-- Reset Button -->
    <button class="btn btn-reset" aria-label="Reset">
      <svg viewBox="0 0 24 24">
        <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
      </svg>
    </button>

  </div>

</body>
</html>
